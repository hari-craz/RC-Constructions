<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Drawing Not Found | RC Constructions</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#232622" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --color-formwork-dark: #232622;
        --color-limewash: #e9e7df;
        --color-concrete: #c4c4bc;
        --color-steel: #7a7e78;
        --color-accent: #e3b341;
        --color-accent-ink: #232622;
        --font-family-display:
          'Big Shoulders Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-family-body: Newsreader, Georgia, serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-formwork-dark);
        color: var(--color-limewash);
        font-family: var(--font-family-body);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .not-found-card {
        width: 100%;
        max-width: 600px;
        border: 1px solid var(--color-steel);
        padding: 2.5rem;
      }

      .not-found-kicker {
        display: block;
        font-size: 0.8125rem;
        letter-spacing: 0.12em;
        color: var(--color-concrete);
        margin-bottom: 0.75rem;
      }

      .not-found-title {
        font-family: var(--font-family-display);
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        line-height: 0.92;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--color-steel);
        padding-bottom: 1.5rem;
      }

      .not-found-message {
        font-size: 1.0625rem;
        line-height: 1.6;
        color: var(--color-concrete);
        margin-bottom: 2rem;
      }

      .not-found-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 1.5rem;
        background-color: var(--color-accent);
        color: var(--color-accent-ink);
        font-family: var(--font-family-display);
        font-size: 0.9375rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .not-found-link:hover {
        opacity: 0.92;
      }

      .not-found-link:focus-visible {
        outline: 2px solid var(--color-limewash);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="not-found-card" role="main">
      <span class="not-found-kicker">SITE RECORD // 404 NOT FOUND</span>
      <h1 class="not-found-title">Drawing Not Found</h1>
      <p class="not-found-message">
        The requested parcel or register sheet does not exist in the active project index. Return to
        the primary survey drawing to inspect current works.
      </p>
      <a href="/" class="not-found-link">Return to project drawing</a>
    </main>
  </body>
</html>
