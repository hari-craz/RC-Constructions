<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%COMPANY_NAME% — General contractor</title>
    <meta
      name="description"
      content="RC Constructions — Architectural general contracting, concrete structural engineering, and commercial building portfolio."
    />
    <meta name="theme-color" content="#232622" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RC Constructions — Architectural General Contractor" />
    <meta
      property="og:description"
      content="Architectural general contracting, concrete structural engineering, and commercial building portfolio."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RC Constructions — Architectural General Contractor" />
    <meta
      name="twitter:description"
      content="Architectural general contracting, concrete structural engineering, and commercial building portfolio."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- JSON-LD Structured Data: GeneralContractor -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "RC Constructions",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/favicon.svg",
        "image": "%SITE_URL%/og-image.png",
        "description": "General contractor building houses, commercial premises, industrial sheds and civil works."
      }
    </script>
  </head>
  <body>
    <noscript>
      <div class="hero-model-static">%HERO_MODEL_SVG%</div>
      <p>%COMPANY_NAME%. This site needs JavaScript to show its drawings and project pages.</p>
      <p>
        Phone: <a href="tel:%CONTACT_PHONE_RAW%">%CONTACT_PHONE_DISPLAY%</a>. Email:
        <a href="mailto:%CONTACT_EMAIL%">%CONTACT_EMAIL%</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
