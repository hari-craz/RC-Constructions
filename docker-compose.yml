services:
  dev:
    image: node:22.14-alpine3.21
    profiles:
      - dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: >
      sh -c "corepack enable && corepack prepare pnpm@10.34.6 --activate && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FORMSPREE_ID: ${VITE_FORMSPREE_ID:-}
    environment:
      - VITE_FORMSPREE_ID=${VITE_FORMSPREE_ID:-}
    profiles:
      - prod
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
